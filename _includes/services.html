<!-- Services Section -->
    <section id="services">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Servicios</h2>
                    <h3 class="section-subheading text-muted">Ofrecemos tratamientos contra varias dolencias</h3>
                </div>
            </div>
            <div class="row text-center">
                {% for service in site.services %}
                {% assign idx = forloop.index0 | modulo:3 | plus:1 %}
                <div class="col-md-4 service-{{ idx }}">
                    <span class="fa-stack fa-4x">
                        {% if service.icon %}
                        <i class="fa fa-circle fa-stack-2x text-primary-{{ idx }}"></i>
                        <i class="fa {{ service.icon }} fa-stack-1x fa-inverse"></i>
                        {% else %}
                        <img src="img/services/{{ service.picname }}.png" class="img-responsive img-centered" alt="">
                        {% endif %}
                    </span>
                    <h4 class="service-heading">{{ service.title }}</h4>
                    <h5 class="service-heading">{{ service.subtitle }}</h5>
                    <p class="text-muted">{{ service.description }}</p>
                </div>
                {% endfor %}

                    <h4 class="service-heading">DUREZAS</h4>
                    <h5 class="service-heading">(HIPERQUERATOSIS)</h5>
                    <p class="text-muted">Es el engrosamiento excesivo de la capa más externa de la piel (estrato córneo) causado por un aumento en la producción de queratina. En podología, suele manifestarse como áreas de piel endurecida, como callosidades o durezas, especialmente en zonas sometidas a presión o fricción repetida.</p>
                </div>
                <div class="col-md-4">
                    <span class="fa-stack fa-4x">

                    <h4 class="service-heading">UÑAS ENCARNADAS</h4>
                    <h5 class="service-heading">(ONICOCRIPTOSIS)</h5>
                    <p class="text-muted">Es una afección comúnmente conocida como uña encarnada. Ocurre cuando el borde lateral o anterior de la uña, generalmente del primer dedo del pie (dedo gordo), se clava en la piel circundante, causando inflamación, dolor, enrojecimiento e incluso infección si no se trata a tiempo.</p>
                </div>

                    </span>

                    <h5 class="service-heading">(PIE DE ATLETA)</h5>

                    </span>
                    <h4 class="service-heading">VERRUGA PLANTAR</h4>
                    <h5 class="service-heading">(PAPILOMA)</h5>
